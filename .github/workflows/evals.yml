name: Evals (LLM judge)

# Paid, non-deterministic LLM-judge evals. Runs nightly and on manual dispatch.
# Requires the ANTHROPIC_API_KEY repo secret; without it the eval self-skips, so
# this workflow is a safe no-op until the secret is added.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:

jobs:
  llm-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
